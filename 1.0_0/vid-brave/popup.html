<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 340px; max-height: 560px; overflow-y: auto;
      margin: 0; padding: 0;
      font: 13px system-ui, -apple-system, sans-serif;
      background: #1b1d22; color: #eee;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #ff472b, #9f1b0e);
      font-weight: 700; font-size: 14px;
    }
    section { padding: 10px 14px; border-bottom: 1px solid #2b2e35; }
    h2 {
      margin: 0 0 8px; font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: #9aa0aa;
    }
    .media {
      display: flex; align-items: center; gap: 8px;
      padding: 8px; border-radius: 8px; background: #23262c; margin-bottom: 6px;
    }
    .media .icon { font-size: 18px; }
    .media .info { flex: 1; min-width: 0; }
    .media .name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 600;
    }
    .media .meta { font-size: 11px; color: #9aa0aa; }
    button.dl {
      border: 0; border-radius: 6px; padding: 6px 10px;
      background: #ff472b; color: #fff; font-weight: 700; cursor: pointer;
    }
    button.dl:disabled { background: #5a5d64; cursor: not-allowed; }
    .empty { color: #9aa0aa; font-size: 12px; padding: 4px 0 2px; }
    .row { display: flex; align-items: center; gap: 10px; }
    #rate { flex: 1; accent-color: #ff472b; }
    #rateVal { min-width: 44px; text-align: right; font-weight: 700; color: #ff7a63; }
    .presets { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    .preset {
      border: 1px solid #3a3e46; background: #23262c; color: #ccc;
      border-radius: 12px; padding: 3px 9px; font-size: 11px; cursor: pointer;
    }
    .preset.active { background: #ff472b; border-color: #ff472b; color: #fff; }
    .toast { margin: 8px 14px 12px; padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none; }
    .toast.ok { display: block; background: #1e3a2a; color: #7be3a0; }
    .toast.err { display: block; background: #3a1e1e; color: #ff9a8a; }
    footer { padding: 8px 14px; font-size: 10.5px; color: #6b707a; }
  </style>
</head>
<body>
  <header>📼 Video Grabber &amp; Speeder</header>

  <section>
    <h2>Playback speed (all media in tab)</h2>
    <div class="row">
      <input id="rate" type="range" min="0.25" max="16" step="0.25" value="1" />
      <span id="rateVal">1x</span>
    </div>
    <div class="presets">
      <button class="preset" data-rate="0.25">0.25x</button>
      <button class="preset" data-rate="0.5">0.5x</button>
      <button class="preset active" data-rate="1">1x</button>
      <button class="preset" data-rate="1.5">1.5x</button>
      <button class="preset" data-rate="2">2x</button>
      <button class="preset" data-rate="3">3x</button>
      <button class="preset" data-rate="5">5x</button>
      <button class="preset" data-rate="8">8x</button>
      <button class="preset" data-rate="16">16x</button>
    </div>
  </section>

  <section>
    <h2>Media found on this page <span id="count"></span></h2>
    <div id="list"><div class="empty">Scanning…</div></div>
  </section>

  <div id="toast" class="toast"></div>
  <footer>Works with direct media files. DRM streams (Netflix, etc.) can't be downloaded.</footer>

  <script src="popup.js"></script>
</body>
</html>
